services:
  app:
    build: .
    container_name: laravel_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://crm.helppro.com.do
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm
      DB_USERNAME: crm_user
      DB_PASSWORD: wSyEP6ZZEUxBUiwj5ZeR
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: laravel_web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - storage_data:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: wSyEP6ZZEUxBUiwj5ZeR
      MYSQL_ROOT_PASSWORD: wSyEP6ZZEUxBUiwj5ZeR
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped

  worker:
    build: .
    container_name: laravel_worker
    restart: unless-stopped
    depends_on:
      - redis
      - db
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm
      DB_USERNAME: crm_user
      DB_PASSWORD: wSyEP6ZZEUxBUiwj5ZeR
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis

  scheduler:
    build: .
    container_name: laravel_scheduler
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm
      DB_USERNAME: crm_user
      DB_PASSWORD: wSyEP6ZZEUxBUiwj5ZeR
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis

volumes:
  db_data:
  storage_data:
